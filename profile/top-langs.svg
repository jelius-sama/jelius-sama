<svg id="gh-dark-mode-only" width="360" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
  font-size: 14px;
  line-height: 21px;
}

/* Catppuccin Latte (Light) */
#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: #eff1f5;
  stroke: #8839ef;
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}

foreignObject {
  width: calc(100% - 10px - 32px);
  height: calc(100% - 10px - 24px);
}

h2 {
  margin-top: 0;
  margin-bottom: 0.75em;
  line-height: 24px;
  font-size: 16px;
  font-weight: 600;
  color: #8839ef;
  fill: #8839ef;
}

ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
}

li {
  display: inline-flex;
  font-size: 12px;
  margin-right: 2ch;
  align-items: center;
  flex-wrap: nowrap;
  transform: translateX(-500%);
  animation: slideIn 2s ease-in-out forwards;
}

@keyframes slideIn {
  to {
    transform: translateX(0);
  }
}

div.ellipsis {
  height: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.octicon {
  fill: #6c6f85;
  margin-right: 0.5ch;
  vertical-align: top;
}

.progress {
  display: flex;
  height: 8px;
  overflow: hidden;
  background-color: #ccd0da;
  border-radius: 6px;
  outline: 1px solid transparent;
  margin-bottom: 1em;
}

.progress-item {
  outline: 2px solid #eff1f5;
  border-collapse: collapse;
}

.lang {
  font-weight: 600;
  margin-right: 4px;
  color: #4c4f69;
}

.percent {
  color: #6c6f85;
}

/* Catppuccin Mocha (Dark via :target) */
#gh-dark-mode-only:target #background {
  fill: #1e1e2e;
  stroke: #cba6f7;
  stroke-width: 1px;
}

#gh-dark-mode-only:target h2 {
  color: #cba6f7;
  fill: #cba6f7;
}

#gh-dark-mode-only:target .octicon {
  color: #a6adc8;
  fill: #a6adc8;
}

#gh-dark-mode-only:target .progress {
  background-color: #313244;
}

#gh-dark-mode-only:target .progress-item {
  outline: 2px solid #1e1e2e;
}

#gh-dark-mode-only:target .lang {
  color: #cdd6f4;
}

#gh-dark-mode-only:target .percent {
  color: #a6adc8;
}
</style>
<g>
<rect x="5" y="5" id="background" />
