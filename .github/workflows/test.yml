name: IPv6 via Cloudflare WARP (wgcf)

on: [push, pull_request]

jobs:
  ipv6-job:
    runs-on: ubuntu-latest
    steps:
      - name: Enable IPv6 via wgcf and WireGuard
        run: |
          # 1. Install WireGuard tools (without openresolv)
          sudo apt-get update
          sudo apt-get install -y wireguard-tools dnsutils jq

          # 2. Download the latest wgcf binary
          WGCF_URL=$(curl -s https://api.github.com/repos/ViRb3/wgcf/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux_amd64$")) | .browser_download_url')
          sudo curl -fsSL "$WGCF_URL" -o /usr/local/bin/wgcf
          sudo chmod +x /usr/local/bin/wgcf

          # 3. Register a WARP account and generate the WireGuard config
          wgcf register --accept-tos
          wgcf generate

          # 4. Patch wgcf-profile.conf for Ubuntu 22.04/24.04 runners
          # Resolve engage.cloudflareclient.com to an IPv4 address
          ENDPOINT_IP=$(dig +short engage.cloudflareclient.com A | head -n 1)
          sed -i "s/engage.cloudflareclient.com/${ENDPOINT_IP}/g" wgcf-profile.conf

          # Remove the DNS line so wg-quick doesn't look for resolvconf/openresolv
          sed -i '/^DNS =/d' wgcf-profile.conf

          # Route ONLY IPv6 traffic through WARP
          sed -i 's/AllowedIPs = 0.0.0.0\/0, ::\/0/AllowedIPs = ::\/0/g' wgcf-profile.conf
          sed -i 's/AllowedIPs = 0.0.0.0\/0/AllowedIPs = ::\/0/g' wgcf-profile.conf

          # 5. Enable IPv6 on the runner kernel and bring up the interface
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=0
          sudo cp wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo wg-quick up wgcf

      - name: Verify IPv6 Connectivity
        run: |
          ip -6 addr show wgcf
          curl -6 -sS https://icanhazip.com
          curl -6 -sS https://www.cloudflare.com/cdn-cgi/trace | grep -E "ip=|warp="
